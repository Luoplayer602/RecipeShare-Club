# Next.js stays on the development host; Docker Desktop resolves this hostname.
upstream nextjs_dev {
    server host.docker.internal:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# No query strings, cookies, authorization, request bodies or client IPs.
log_format observability escape=json '{"event":"http_request","method":"$request_method",'
    '"path":"$uri","status":$status,"duration_seconds":$request_time,'
    '"upstream_duration_seconds":"$upstream_response_time","request_id":"$request_id"}';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;
    access_log /dev/stdout observability;
    access_log syslog:server=promtail:1515,tag=nginx observability;
    error_log /dev/stderr warn;
    error_log syslog:server=promtail:1516,tag=nginx warn;

    # The application accepts videos up to 50 MiB, plus multipart overhead.
    client_max_body_size 51m;
    client_body_timeout 120s;
    send_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-ID $request_id always;
    # Keep document protections without blocking Next.js scripts or media previews.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Nginx liveness is intentionally independent of the development server/DB.
    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # Scrapes reach the host directly with a token, never through the public site.
    location = /api/metrics { return 404; }

    location / {
        proxy_pass http://nextjs_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        # This is the local edge proxy; replace untrusted client-supplied values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        # Allow cold dev compilation, slow uploads and the HMR WebSocket.
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }
}

# Internal listener: no published host port, only the exporter uses this server.
server {
    listen 8082;
    server_name _;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
