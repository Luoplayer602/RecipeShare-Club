# Only this non-root proxy can access the Docker socket. No host port is published.
upstream docker_engine {
    server unix:/var/run/docker.sock;
}

server {
    listen 2375;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;

    if ($request_method !~ ^(GET|HEAD)$) { return 403; }

    # Telegraf uses ping/version negotiation, daemon info, container list,
    # inspect (state/limits) and one-shot stats. Deny logs, archive, exec, etc.
    location ~ "^(/v[0-9]+[.][0-9]+)?/(_ping|version|info|containers/json|containers/[0-9a-f]{64}/(json|stats))$" {
        proxy_pass http://docker_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }
    location / { return 403; }
}
