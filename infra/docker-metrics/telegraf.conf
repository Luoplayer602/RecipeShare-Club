[agent]
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = true
  skip_processors_after_aggregators = false

[[inputs.docker]]
  endpoint = "tcp://docker-metrics-proxy:2375"
  timeout = "10s"
  gather_services = false
  container_name_include = ["${COMPOSE_PROJECT_NAME}-*"]
  container_state_include = ["running", "restarting", "exited", "paused", "dead"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service"]
  tag_env = []
  perdevice_include = []
  total_include = ["cpu", "network"]
  namepass = ["docker_container_cpu", "docker_container_mem", "docker_container_net", "docker_container_status", "docker_container_health"]
  tagexclude = ["container_image", "container_version", "engine_host", "server_version"]
  fieldexclude = ["container_id", "pid"]
  [inputs.docker.tagpass]
    "com.docker.compose.project" = ["${COMPOSE_PROJECT_NAME}"]

[[inputs.internal]]
  collect_memstats = false
  namepass = ["internal_gather"]

[[outputs.prometheus_client]]
  listen = ":9273"
  expiration_interval = "45s"
  string_as_label = false
  collectors_exclude = ["gocollector", "process"]
  [outputs.prometheus_client.metric_types]
    counter = ["docker_container_net_rx_bytes", "docker_container_net_tx_bytes", "internal_gather_errors"]
    gauge = ["docker_container_cpu_usage_percent", "docker_container_mem_*", "docker_container_status_*", "docker_container_health_*"]
