global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]
  - job_name: recipeshare
    scrape_timeout: 10s
    metrics_path: /api/metrics
    authorization:
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets: [host.docker.internal:3000]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
