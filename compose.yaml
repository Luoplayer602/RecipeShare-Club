name: ${COMPOSE_PROJECT_NAME:-recipeshare-club}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge, monitoring]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

  mysql:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipeshare}
      MYSQL_USER: ${MYSQL_USER:-recipe_owner}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_owner_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_owner_password
      - mysql_root_password
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [data, admin]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/mysql_owner_password)"
          mysql --protocol=TCP --host=127.0.0.1 --user="$$MYSQL_USER"
          --database="$$MYSQL_DATABASE" --execute='SELECT 1' > /dev/null
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    logging: *logging

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 16M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    networks: [data, admin]
    security_opt: [no-new-privileges:true]
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8082/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [monitoring]
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    secrets: [metrics_bearer_token]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [monitoring]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_LOG_MODE: console
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [monitoring]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

networks:
  monitoring:
  edge:
  data:
    internal: true
  admin:

volumes:
  prometheus_data:
  grafana_data:
  mysql_data:

secrets:
  metrics_bearer_token:
    file: ./.secrets/metrics_bearer_token.txt
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password.txt
  mysql_owner_password:
    file: ./.secrets/mysql_owner_password.txt
  mysql_root_password:
    file: ./.secrets/mysql_root_password.txt
